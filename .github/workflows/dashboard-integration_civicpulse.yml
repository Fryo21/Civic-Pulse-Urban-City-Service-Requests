# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - CivicPulse

on:
  push:
    branches:
      - dashboard-integration
    paths:
      - "src/web_app/backend/**"
      - ".github/workflows/dashboard-integration_civicpulse.yml"
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/web_app/backend/requirements.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: civicpulse-backend
          path: src/web_app/backend/


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: civicpulse-backend
          path: backend-package
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0150D2161E5846D899C086D3E8F0443B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6603E4CC6B2E4D8DBE0201A5F1C0C0AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DAC1E5705DEC4C579AA27DE5F7915EF0 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'CivicPulse'
          slot-name: 'Production'
          
